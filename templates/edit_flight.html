<!DOCTYPE html>
<html>

<head>
    <title>Edit Flight</title>
</head>

<body>

<h1>Edit Flight</h1>

<form method="POST">

    <input
        type="text"
        name="flight_number"
        value="{{ flight.flight_number }}"
        required
    >

    <br><br>

    <input
        type="text"
        name="airline"
        value="{{ flight.airline.name }}"
        required
    >

    <br><br>

    <input
        type="text"
        name="from_airport"
        value="{{ flight.departure_airport.code }}"
        required
    >

    <br><br>

    <input
        type="text"
        name="to_airport"
        value="{{ flight.arrival_airport.code }}"
        required
    >

    <br><br>

    <input
        type="number"
        step="0.01"
        name="price"
        value="{{ flight.price }}"
        required
    >

    <br><br>

    <input
        type="number"
        name="duration"
        value="{{ flight.duration }}"
        required
    >

    <br><br>

    <button type="submit">
        Update
    </button>

</form>

</body>
</html>
