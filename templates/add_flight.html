<form method="POST">

    <input
        type="text"
        name="flight_number"
        placeholder="Flight Number"
        required
    >

    <br><br>

    <input
        type="text"
        name="airline"
        placeholder="Airline"
        required
    >

    <br><br>

    <input
        type="text"
        name="from_airport"
        placeholder="From Airport"
        required
    >

    <br><br>

    <input
        type="text"
        name="to_airport"
        placeholder="To Airport"
        required
    >

    <br><br>

    <input
        type="number"
        step="0.01"
        name="price"
        placeholder="Price"
        required
    >

    <br><br>

    <input
        type="number"
        name="duration"
        placeholder="Duration"
        required
    >

    <br><br>

    <button type="submit">
        Save
    </button>

</form>
